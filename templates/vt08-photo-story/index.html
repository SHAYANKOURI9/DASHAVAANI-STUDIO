<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"category","type":"string","label":"Category","default":"CITY","maxLength":24},
    {"id":"headline","type":"string","label":"Headline","default":"Thousands gather for the Bathukamma festival at Tank Bund","maxLength":90},
    {"id":"standfirst","type":"string","label":"Standfirst","default":"Police diverted traffic on four roads for the evening","maxLength":120},
    {"id":"photo_credit","type":"string","label":"Photo credit","default":"Dashavani","maxLength":40},
    {"id":"badge","type":"string","label":"Language badge","default":"English"},
    {"id":"dateline","type":"string","label":"Dateline","default":"HYDERABAD  ■  13 OCT 2026  ■  19:00 IST"},
    {"id":"ticker","type":"string","label":"Ticker","default":"TRAFFIC DIVERTED ON FOUR ROADS  ■  METRO TO RUN LATE SERVICES  ■  MORE UPDATES ON DASHAVANI"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>VT-08 Photo Story</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anek Latin"; src: url("assets/fonts/AnekLatin.ttf") format("truetype"); font-weight: 100 800; font-stretch: 75% 125%; }
      @font-face { font-family: "Noto Sans Telugu"; src: url("assets/fonts/NotoSansTelugu.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62.5% 100%; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("assets/fonts/NotoSansDevanagari.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62.5% 100%; }
      @font-face { font-family: "Noto Sans Tamil"; src: url("assets/fonts/NotoSansTamil.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Kannada"; src: url("assets/fonts/NotoSansKannada.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Malayalam"; src: url("assets/fonts/NotoSansMalayalam.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Bengali"; src: url("assets/fonts/NotoSansBengali.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Gujarati"; src: url("assets/fonts/NotoSansGujarati.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Oriya"; src: url("assets/fonts/NotoSansOriya.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Anek Telugu"; src: url("assets/fonts/AnekTelugu.ttf") format("truetype"); font-weight: 100 800; font-stretch: 75% 125%; }
      @font-face { font-family: "Tiro Telugu"; src: url("assets/fonts/TiroTelugu-Italic.ttf") format("truetype"); font-style: italic; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #16204a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #16204a; color: #f3ede2; font-family: "Anek Latin", "Noto Sans Telugu", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Kannada", "Noto Sans Malayalam", "Noto Sans Bengali", "Noto Sans Gujarati", "Noto Sans Oriya", sans-serif; }
      .caps { font-weight: 600; font-stretch: 75%; letter-spacing: 0.16em; }
      html:not(:lang(en)) .caps, html:not(:lang(en)) #category { letter-spacing: 0; }

      /* the photo is the story: full frame, a slow push-in, darkened only where the words sit */
      #photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 60% 40%; }
      #shade { position: absolute; inset: 0; background:
        linear-gradient(180deg, rgba(22, 32, 74, 0.75) 0%, rgba(22, 32, 74, 0) 18%),
        linear-gradient(0deg, rgba(22, 32, 74, 0.96) 0%, rgba(22, 32, 74, 0.82) 30%, rgba(22, 32, 74, 0) 62%); }

      #logo { position: absolute; left: 72px; top: 52px; display: flex; align-items: center; gap: 15px; }
      #logo .dash { font-size: 48px; line-height: 0.85; font-weight: 800; font-stretch: 125%; }
      #logo .bar { width: 8px; height: 42px; background: #f0a202; }
      #logo .vani { font-size: 28px; line-height: 0.85; font-weight: 500; font-stretch: 75%; letter-spacing: 0.22em; }
      #dateline { position: absolute; left: 0; right: 0; top: 60px; text-align: center; font-size: 24px; }
      #badge { position: absolute; right: 72px; top: 46px; background: #f0a202; color: #16204a; padding: 9px 18px; font-size: 26px; font-weight: 700; }

      #story { position: absolute; left: 72px; bottom: 120px; width: 1240px; display: flex; flex-direction: column; gap: 18px; }
      #category { align-self: flex-start; background: #f0a202; color: #16204a; padding: 9px 21px; font-size: 24px; font-weight: 700; font-stretch: 75%; letter-spacing: 0.2em; }
      #headline { font-size: 80px; line-height: 1.04; font-weight: 700; font-stretch: 87%; max-height: 252px; overflow: hidden; }
      #standfirst { font-family: "Tiro Telugu", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Kannada", "Noto Sans Malayalam", "Noto Sans Bengali", "Noto Sans Gujarati", "Noto Sans Oriya", serif; font-style: italic; font-size: 36px; line-height: 1.25; color: #d9d3c6; }
      #credit { position: absolute; left: 72px; bottom: 82px; font-size: 18px; color: #c4bfb3; }

      /* presenter as an inset, framed like a studio monitor */
      #panel { position: absolute; right: 72px; bottom: 120px; width: 380px; height: 475px; background: #222e63; overflow: hidden; outline: 4px solid #f3ede2; }
      #avatar { position: absolute; left: 0; top: 0; width: 380px; height: 475px; object-fit: cover; object-position: center top; }
      #disclosure { position: absolute; right: 72px; bottom: 603px; display: flex; }
      #disclosure .ai { background: #f3ede2; color: #16204a; padding: 7px 12px; font-size: 16px; font-weight: 800; letter-spacing: 0.14em; }

      /* subtitles go high over the photo here: the headline block owns the bottom of the frame */
      #root #captions.h { top: 150px; bottom: auto; }
      #ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; background: #f3ede2; color: #16204a; overflow: hidden; }
      #ticker .tag { flex-shrink: 0; z-index: 1; display: flex; align-items: center; padding: 0 24px; background: #16204a; color: #f0a202; border: 3px solid #f3ede2; font-size: 26px; font-weight: 800; font-stretch: 125%; }
      #ticker-track, .ticker-copy { display: flex; align-items: center; white-space: nowrap; padding-left: 30px; font-size: 27px; font-weight: 600; font-stretch: 75%; letter-spacing: 0.06em; }
      #ticker-track::after, .ticker-copy::after { content: "■"; margin-left: 30px; }
      /* Telugu and Hindi stack vowel signs above and below the line: give them room so nothing is clipped */
      html:not(:lang(en)) #headline, html:not(:lang(en)) .point p, html:not(:lang(en)) #standfirst { line-height: 1.3; padding-bottom: 0.06em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <img id="photo" src="assets/photo-placeholder.jpg" alt="" />
      <div id="shade"></div>
      <div id="panel">
        <video id="avatar" data-start="0" data-track-index="1" src="assets/avatar-placeholder.mp4" muted playsinline></video>
      </div>
      <audio id="voice" data-start="0" data-track-index="10" src="assets/voice-placeholder.m4a" data-volume="1"></audio>

      <div id="logo"><div class="dash">DASHA</div><div class="bar"></div><div class="vani">VANI</div></div>
      <div id="dateline" class="caps" data-var-text="dateline">HYDERABAD  ■  13 OCT 2026  ■  19:00 IST</div>
      <div id="badge" data-var-text="badge">English</div>
      <div id="disclosure"><div class="ai">AI PRESENTER</div></div>

      <div id="story">
        <div id="category" data-var-text="category">CITY</div>
        <h1 id="headline" data-var-text="headline">Thousands gather for the Bathukamma festival at Tank Bund</h1>
        <p id="standfirst" data-var-text="standfirst">Police diverted traffic on four roads for the evening</p>
      </div>
      <div id="credit" class="caps"><span>PHOTO: </span><span data-var-text="photo_credit">Dashavani</span></div>

      <div id="ticker">
        <div class="tag">LATEST</div>
        <div id="ticker-track" data-var-text="ticker">TRAFFIC DIVERTED ON FOUR ROADS  ■  METRO TO RUN LATE SERVICES  ■  MORE UPDATES ON DASHAVANI</div>
      </div>
    </div>
    <script>
      document.fonts.ready.then(() => {
        const h = document.getElementById("headline");
        for (let size = 80; h.scrollHeight > 252 && size > 48; size -= 4) h.style.fontSize = size + "px";

        const total = Number(document.getElementById("root").dataset.duration);
        const track = document.getElementById("ticker-track");
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#photo", { scale: 1.02 }, { scale: 1.14, duration: total, ease: "none" }, 0);
        tl.fromTo("#category", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.3);
        tl.fromTo("#headline", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.45);
        tl.fromTo("#standfirst", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.0);
        tl.fromTo("#panel", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.8);
        tl.fromTo("#disclosure", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.2);

        // Ticker loops without a seam: copies of the line follow it on one belt that moves at a steady speed for the whole story.
        const belt = document.createElement("div");
        belt.style.display = "flex";
        track.before(belt);
        belt.append(track);
        const w = track.offsetWidth, speed = 120;
        for (let i = 0; i < Math.ceil(belt.parentElement.clientWidth / w) + 1; i++) {
          const copy = track.cloneNode(true);
          copy.removeAttribute("id"); copy.removeAttribute("data-var-text");
          copy.className = "ticker-copy";
          belt.append(copy);
        }
        tl.fromTo(belt, { x: 0 }, { x: -w, duration: w / speed, ease: "none", repeat: Math.ceil((total * speed) / w) }, 0);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
