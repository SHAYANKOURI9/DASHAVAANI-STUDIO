<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"headline","type":"string","label":"Headline","default":"RBI keeps repo rate unchanged","maxLength":90},
    {"id":"figure_value","type":"string","label":"Key figure","default":"6.5%","maxLength":14},
    {"id":"figure_label","type":"string","label":"What the figure is","default":"POLICY REPO RATE","maxLength":40},
    {"id":"figure_context","type":"string","label":"Figure context","default":"Unchanged from the last policy meeting","maxLength":90},
    {"id":"source","type":"string","label":"Source","default":"RBI","maxLength":40},
    {"id":"badge","type":"string","label":"Language badge","default":"English"},
    {"id":"dateline","type":"string","label":"Dateline","default":"MUMBAI  ■  08 OCT 2026  ■  10:05 IST"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>VT-04 Numbers Desk</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anek Latin"; src: url("assets/fonts/AnekLatin.ttf") format("truetype"); font-weight: 100 800; font-stretch: 75% 125%; }
      @font-face { font-family: "Noto Sans Telugu"; src: url("assets/fonts/NotoSansTelugu.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62.5% 100%; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("assets/fonts/NotoSansDevanagari.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62.5% 100%; }
      @font-face { font-family: "Noto Sans Tamil"; src: url("assets/fonts/NotoSansTamil.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Kannada"; src: url("assets/fonts/NotoSansKannada.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Malayalam"; src: url("assets/fonts/NotoSansMalayalam.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Bengali"; src: url("assets/fonts/NotoSansBengali.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Gujarati"; src: url("assets/fonts/NotoSansGujarati.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Oriya"; src: url("assets/fonts/NotoSansOriya.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Anek Telugu"; src: url("assets/fonts/AnekTelugu.ttf") format("truetype"); font-weight: 100 800; font-stretch: 75% 125%; }
      @font-face { font-family: "Tiro Telugu"; src: url("assets/fonts/TiroTelugu-Italic.ttf") format("truetype"); font-style: italic; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f3ede2; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f3ede2; color: #16204a; font-family: "Anek Latin", "Noto Sans Telugu", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Kannada", "Noto Sans Malayalam", "Noto Sans Bengali", "Noto Sans Gujarati", "Noto Sans Oriya", sans-serif; }
      .caps { font-weight: 600; font-stretch: 75%; letter-spacing: 0.16em; }
      html:not(:lang(en)) .caps, html:not(:lang(en)) #label { letter-spacing: 0; }

      #top { position: absolute; left: 72px; right: 72px; top: 48px; display: flex; justify-content: space-between; align-items: center; }
      #logo { display: flex; align-items: center; gap: 15px; }
      #logo .dash { font-size: 48px; line-height: 0.85; font-weight: 800; font-stretch: 125%; }
      #logo .bar { width: 8px; height: 42px; background: #f0a202; }
      #logo .vani { font-size: 28px; line-height: 0.85; font-weight: 500; font-stretch: 75%; letter-spacing: 0.22em; }
      #desk { margin-left: 27px; background: #16204a; color: #f3ede2; padding: 8px 18px; font-size: 22px; font-weight: 700; font-stretch: 75%; letter-spacing: 0.2em; }
      #dateline { font-size: 24px; }
      #rule { position: absolute; left: 72px; right: 72px; top: 126px; display: flex; flex-direction: column; gap: 6px; }
      #rule div:first-child { height: 6px; background: #16204a; }
      #rule div:last-child { height: 2px; background: #16204a; }

      #main { position: absolute; left: 72px; top: 168px; width: 1110px; height: 840px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
      #headline { font-size: 58px; line-height: 1.08; font-weight: 700; font-stretch: 87%; max-height: 190px; overflow: hidden; }
      #label { align-self: flex-start; background: #f0a202; padding: 9px 21px; font-size: 24px; font-weight: 700; font-stretch: 75%; letter-spacing: 0.2em; margin-top: 12px; }
      #figure { font-size: 330px; line-height: 0.86; font-weight: 800; font-stretch: 75%; letter-spacing: -0.03em; white-space: nowrap; transform-origin: left bottom; }
      #context { border-top: 2px solid #16204a; border-bottom: 2px solid #16204a; padding: 18px 0; font-family: "Tiro Telugu", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Kannada", "Noto Sans Malayalam", "Noto Sans Bengali", "Noto Sans Gujarati", "Noto Sans Oriya", serif; font-style: italic; font-size: 38px; line-height: 1.25; color: #2b3358; }

      #panel { position: absolute; right: 72px; top: 168px; width: 600px; height: 760px; background: #222e63; overflow: hidden; }
      #avatar { position: absolute; left: 0; bottom: 0; width: 600px; height: 760px; object-fit: cover; object-position: center bottom; }
      #disclosure { position: absolute; left: 1278px; top: 870px; display: flex; }
      #disclosure .ai { background: #f3ede2; color: #16204a; padding: 9px 15px; font-size: 18px; font-weight: 800; letter-spacing: 0.14em; }
      #disclosure .lang { background: #16204a; color: #f3ede2; border: 2px solid #f3ede2; border-left: none; padding: 8px 15px; font-size: 18px; font-weight: 700; }
      #seal { position: absolute; right: 72px; top: 954px; display: flex; align-items: center; gap: 12px; border: 2px solid #16204a; padding: 10px 18px; font-size: 21px; }
      /* Telugu and Hindi stack vowel signs above and below the line: give them room so nothing is clipped */
      html:not(:lang(en)) #headline, html:not(:lang(en)) .point p, html:not(:lang(en)) #standfirst { line-height: 1.3; padding-bottom: 0.06em; }
      /* no ticker here: subtitles sit in the free strip at the bottom of the text column, clear of the figure, the points and the presenter */
      #root #captions.h { top: auto; bottom: 30px; left: 72px; right: 760px; justify-items: start; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="top">
        <div id="logo"><div class="dash">DASHA</div><div class="bar"></div><div class="vani">VANI</div><div id="desk">NUMBERS DESK</div></div>
        <div id="dateline" class="caps" data-var-text="dateline">MUMBAI  ■  08 OCT 2026  ■  10:05 IST</div>
      </div>
      <div id="rule"><div></div><div></div></div>

      <div id="main">
        <h1 id="headline" data-var-text="headline">RBI keeps repo rate unchanged</h1>
        <div id="label" data-var-text="figure_label">POLICY REPO RATE</div>
        <div id="figure" data-var-text="figure_value">6.5%</div>
        <p id="context" data-var-text="figure_context">Unchanged from the last policy meeting</p>
      </div>

      <div id="panel">
        <video id="avatar" data-start="0" data-track-index="1" src="assets/avatar-placeholder.mp4" muted playsinline></video>
      </div>
      <audio id="voice" data-start="0" data-track-index="10" src="assets/voice-placeholder.m4a" data-volume="1"></audio>
      <div id="disclosure"><div class="ai">AI PRESENTER</div><div class="lang" data-var-text="badge">English</div></div>
      <div id="seal" class="caps">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16204a" stroke-width="3" stroke-linecap="square"><path d="M4 12l5 5L20 6"></path></svg>
        <span>SOURCE: </span><span data-var-text="source">RBI</span><span> · VERIFIED</span>
      </div>
    </div>
    <script>
      document.fonts.ready.then(() => {
        const h = document.getElementById("headline");
        for (let size = 58; h.scrollHeight > 190 && size > 40; size -= 3) h.style.fontSize = size + "px";
        // Long figures ("₹1,20,000 crore") shrink to fit the column.
        const f = document.getElementById("figure");
        for (let size = 330; f.scrollWidth > 1110 && size > 120; size -= 10) f.style.fontSize = size + "px";

        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#headline", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
        tl.fromTo("#label", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.6);
        tl.fromTo("#figure", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" }, 0.8);
        tl.fromTo("#context", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.4);
        tl.fromTo("#seal", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.8);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
