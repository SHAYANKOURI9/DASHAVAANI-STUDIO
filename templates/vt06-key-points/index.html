<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"category","type":"string","label":"Category","default":"SCHEMES","maxLength":24},
    {"id":"headline","type":"string","label":"Headline","default":"What changes in the new crop insurance scheme","maxLength":90},
    {"id":"points","type":"string","label":"Points (separated by ■)","default":"PREMIUM CUT TO 1.5% FOR FARMERS  ■  CLAIMS SETTLED WITHIN 30 DAYS  ■  TENANT FARMERS NOW COVERED"},
    {"id":"badge","type":"string","label":"Language badge","default":"English"},
    {"id":"dateline","type":"string","label":"Dateline","default":"HYDERABAD  ■  13 OCT 2026  ■  10:00 IST"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>VT-06 Key Points</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anek Latin"; src: url("assets/fonts/AnekLatin.ttf") format("truetype"); font-weight: 100 800; font-stretch: 75% 125%; }
      @font-face { font-family: "Noto Sans Telugu"; src: url("assets/fonts/NotoSansTelugu.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62.5% 100%; }
      @font-face { font-family: "Noto Sans Devanagari"; src: url("assets/fonts/NotoSansDevanagari.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62.5% 100%; }
      @font-face { font-family: "Noto Sans Tamil"; src: url("assets/fonts/NotoSansTamil.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Kannada"; src: url("assets/fonts/NotoSansKannada.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Malayalam"; src: url("assets/fonts/NotoSansMalayalam.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Bengali"; src: url("assets/fonts/NotoSansBengali.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Gujarati"; src: url("assets/fonts/NotoSansGujarati.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Noto Sans Oriya"; src: url("assets/fonts/NotoSansOriya.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Anek Telugu"; src: url("assets/fonts/AnekTelugu.ttf") format("truetype"); font-weight: 100 800; font-stretch: 75% 125%; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f3ede2; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f3ede2; color: #16204a; font-family: "Anek Latin", "Noto Sans Telugu", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Kannada", "Noto Sans Malayalam", "Noto Sans Bengali", "Noto Sans Gujarati", "Noto Sans Oriya", sans-serif; }
      .caps { font-weight: 600; font-stretch: 75%; letter-spacing: 0.16em; }
      html:not(:lang(en)) .caps, html:not(:lang(en)) #category, html:not(:lang(en)) .point p { letter-spacing: 0; }

      #top { position: absolute; left: 72px; right: 72px; top: 48px; display: flex; justify-content: space-between; align-items: center; }
      #logo { display: flex; align-items: center; gap: 15px; }
      #logo .dash { font-size: 48px; line-height: 0.85; font-weight: 800; font-stretch: 125%; }
      #logo .bar { width: 8px; height: 42px; background: #f0a202; }
      #logo .vani { font-size: 28px; line-height: 0.85; font-weight: 500; font-stretch: 75%; letter-spacing: 0.22em; }
      #desk { margin-left: 27px; background: #16204a; color: #f3ede2; padding: 8px 18px; font-size: 22px; font-weight: 700; font-stretch: 75%; letter-spacing: 0.2em; }
      #dateline { font-size: 24px; }
      #rule { position: absolute; left: 72px; right: 72px; top: 126px; display: flex; flex-direction: column; gap: 6px; }
      #rule div:first-child { height: 6px; background: #16204a; }
      #rule div:last-child { height: 2px; background: #16204a; }

      /* explainer column: headline, then the points as a ruled, numbered list */
      #main { position: absolute; left: 72px; top: 170px; width: 1110px; height: 850px; display: flex; flex-direction: column; }
      #category { align-self: flex-start; background: #f0a202; padding: 9px 21px; font-size: 24px; font-weight: 700; font-stretch: 75%; letter-spacing: 0.2em; }
      #headline { margin-top: 20px; font-size: 64px; line-height: 1.05; font-weight: 700; font-stretch: 87%; max-height: 210px; overflow: hidden; }
      #list { margin-top: 34px; border-top: 6px solid #16204a; }
      .point { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 12px; padding: 22px 0; border-bottom: 2px solid #16204a; opacity: 0.25; }
      .point b { font-size: 96px; line-height: 0.8; font-weight: 800; font-stretch: 75%; color: rgba(22, 32, 74, 0); -webkit-text-stroke: 3px #16204a; }
      .point p { font-size: 44px; line-height: 1.12; font-weight: 700; font-stretch: 75%; letter-spacing: 0.03em; }
      #points-src { display: none; }

      #panel { position: absolute; right: 72px; top: 170px; width: 600px; height: 760px; background: #222e63; overflow: hidden; }
      #avatar { position: absolute; left: 0; bottom: 0; width: 600px; height: 760px; object-fit: cover; object-position: center bottom; }
      #disclosure { position: absolute; left: 1278px; top: 870px; display: flex; }
      #disclosure .ai { background: #f3ede2; color: #16204a; padding: 9px 15px; font-size: 18px; font-weight: 800; letter-spacing: 0.14em; }
      #disclosure .lang { background: #16204a; color: #f3ede2; border: 2px solid #f3ede2; border-left: none; padding: 8px 15px; font-size: 18px; font-weight: 700; }
      /* Telugu and Hindi stack vowel signs above and below the line: give them room so nothing is clipped */
      html:not(:lang(en)) #headline, html:not(:lang(en)) .point p, html:not(:lang(en)) #standfirst { line-height: 1.3; padding-bottom: 0.06em; }
      /* no ticker here: subtitles sit in the free strip at the bottom of the text column, clear of the figure, the points and the presenter */
      #root #captions.h { top: auto; bottom: 30px; left: 72px; right: 760px; justify-items: start; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="top">
        <div id="logo"><div class="dash">DASHA</div><div class="bar"></div><div class="vani">VANI</div><div id="desk">KEY POINTS</div></div>
        <div id="dateline" class="caps" data-var-text="dateline">HYDERABAD  ■  13 OCT 2026  ■  10:00 IST</div>
      </div>
      <div id="rule"><div></div><div></div></div>

      <div id="main">
        <div id="category" data-var-text="category">SCHEMES</div>
        <h1 id="headline" data-var-text="headline">What changes in the new crop insurance scheme</h1>
        <div id="list"></div>
        <div id="points-src" data-var-text="points">PREMIUM CUT TO 1.5% FOR FARMERS  ■  CLAIMS SETTLED WITHIN 30 DAYS  ■  TENANT FARMERS NOW COVERED</div>
      </div>

      <div id="panel">
        <video id="avatar" data-start="0" data-track-index="1" src="assets/avatar-placeholder.mp4" muted playsinline></video>
      </div>
      <audio id="voice" data-start="0" data-track-index="10" src="assets/voice-placeholder.m4a" data-volume="1"></audio>
      <div id="disclosure"><div class="ai">AI PRESENTER</div><div class="lang" data-var-text="badge">English</div></div>
    </div>
    <script>
      document.fonts.ready.then(() => {
        const h = document.getElementById("headline");
        for (let size = 64; h.scrollHeight > 210 && size > 44; size -= 3) h.style.fontSize = size + "px";

        // The points arrive as one line separated by ■; each becomes a numbered row.
        const points = document.getElementById("points-src").textContent.split("■").map((p) => p.trim()).filter(Boolean).slice(0, 4);
        const list = document.getElementById("list");
        points.forEach((text, i) => {
          const row = document.createElement("div");
          row.className = "point";
          row.innerHTML = "<b></b><p></p>";
          row.querySelector("b").textContent = String(i + 1);
          row.querySelector("p").textContent = text;
          list.append(row);
        });
        // Rows shrink together until the list fits under the headline.
        const room = 850 - list.offsetTop;
        for (let size = 44; list.offsetHeight > room && size > 28; size -= 2) list.querySelectorAll(".point p").forEach((p) => (p.style.fontSize = size + "px"));

        const total = Number(document.getElementById("root").dataset.duration);
        const rows = [...list.children];
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#category", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.fromTo("#headline", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.35);
        tl.fromTo("#list", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.8);
        // Each point takes its turn while the voice covers it: lit and filled gold, then settled once the next one starts.
        const start = 1.4, each = Math.max(1.5, (total - start - 1) / Math.max(1, rows.length));
        rows.forEach((row, i) => {
          const t = start + i * each, num = row.querySelector("b");
          tl.to(row, { opacity: 1, duration: 0.4 }, t);
          tl.fromTo(row, { x: -16 }, { x: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, t);
          tl.to(num, { color: "#f0a202", duration: 0.4 }, t);
          if (i < rows.length - 1) {
            tl.to(row, { opacity: 0.6, duration: 0.4 }, t + each);
            tl.to(num, { color: "#16204a", duration: 0.4 }, t + each);
          }
        });
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
